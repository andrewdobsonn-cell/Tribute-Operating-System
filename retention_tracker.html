<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tribute — Caregiver Retention Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f7f7f5;--bg3:#ededea;--text:#1a1a18;--text2:#6b6b67;--text3:#9e9c96;--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);--green:#1D9E75;--amber:#EF9F27;--red:#E24B4A;--blue:#185FA5;--purple:#7B4FBE;--green-bg:#E1F5EE;--amber-bg:#FAEEDA;--red-bg:#FCEBEB;--blue-bg:#E6F1FB;--green-text:#0F6E56;--amber-text:#633806;--red-text:#791F1F;--blue-text:#0C447C;--r:8px;--rl:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--bg2:#232320;--bg3:#2c2c29;--text:#e8e6e0;--text2:#9e9c96;--text3:#6b6b67;--border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);--green-bg:#04342C;--amber-bg:#412402;--red-bg:#501313;--blue-bg:#042C53;--green-text:#9FE1CB;--amber-text:#FAC775;--red-text:#F09595;--blue-text:#85B7EB}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:20px;max-width:1400px;margin:0 auto;font-size:14px;line-height:1.5}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:.5px solid var(--border);margin-bottom:16px;flex-wrap:wrap;gap:10px}
.logo{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.title{font-size:22px;font-weight:500;margin-top:3px}
.sub{font-size:11px;color:var(--text3);margin-top:2px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.loading{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}
.spin{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--red-bg);color:var(--red-text);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-size:13px}
.nav-tabs{display:flex;border-bottom:.5px solid var(--border);margin-bottom:16px;overflow-x:auto;align-items:center}
.ntab{font-size:12px;font-weight:500;color:var(--text2);padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-.5px;white-space:nowrap;user-select:none}
.ntab.on{color:var(--text);border-bottom-color:var(--text)}
.banner{border-radius:var(--r);padding:12px 16px;margin-bottom:16px;border-left:3px solid var(--blue);background:var(--bg2);font-size:13px;line-height:1.6}
.bl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:4px}
.kg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:800px){.kg{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:500px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--bg2);border-radius:var(--r);padding:14px 16px}
.kl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin-bottom:6px}
.kv{font-size:24px;font-weight:500;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.ks{font-size:11px;color:var(--text3)}
.kv.g{color:var(--green)}.kv.b{color:var(--blue)}.kv.a{color:var(--amber)}.kv.r{color:var(--red)}.kv.p{color:var(--purple)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);padding:7px 10px;border-bottom:.5px solid var(--border2);text-align:right;white-space:nowrap;cursor:pointer;user-select:none;background:var(--bg2);position:sticky;top:0;z-index:1}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px 10px;border-bottom:.5px solid var(--border);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.tbl td:first-child{text-align:left;font-weight:500}
.tbl tbody tr:hover td{background:var(--bg2)}
.tbl-wrap{overflow-x:auto;max-height:640px;overflow-y:auto;border:1px solid var(--border);border-radius:8px}
.bdg{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block}
.bg{background:var(--green-bg);color:var(--green-text)}.ba{background:var(--amber-bg);color:var(--amber-text)}.br{background:var(--red-bg);color:var(--red-text)}.bb{background:var(--blue-bg);color:var(--blue-text)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:6px 10px;font-size:12px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text)}
.toolbar .srch{flex:1;min-width:200px}
.export-btn{padding:6px 14px;font-size:11px;font-weight:600;border:none;border-radius:6px;cursor:pointer;background:var(--blue);color:#fff}
.export-btn:hover{opacity:.85}
.exp-arrow{display:inline-block;width:10px;font-size:10px;color:var(--text3);margin-right:6px;transition:transform .15s}
tr.expanded .exp-arrow{transform:rotate(90deg);color:var(--text)}
tr.cg-row{cursor:pointer}
.detail{background:var(--bg2)!important;padding:14px 18px!important;text-align:left!important}
.detail dl{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:12px}
.detail dt{color:var(--text2);font-weight:600}
.detail dd{color:var(--text);white-space:pre-wrap}
.fc{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:12px}
.ct{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin-bottom:12px}
.bar-row{display:grid;grid-template-columns:230px 1fr 46px;gap:10px;align-items:center;margin-bottom:6px;font-size:12px}
.bar-track{background:var(--bg3);border-radius:6px;height:18px;overflow:hidden}
.bar-fill{height:100%;background:var(--blue);border-radius:6px}
.bar-fill.r{background:var(--red)}.bar-fill.a{background:var(--amber)}.bar-fill.g{background:var(--green)}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--text2)}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.gate-box{width:340px;max-width:90vw;text-align:center}
.gate-box input{width:100%;padding:10px 12px;font-size:14px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text);margin:14px 0 10px}
.gate-box button{width:100%;padding:10px;font-size:13px;font-weight:600;border:none;border-radius:var(--r);background:var(--text);color:var(--bg);cursor:pointer}
.gate-err{color:var(--red-text);font-size:12px;margin-top:10px;min-height:16px}
.scaffold{text-align:center;padding:50px 20px;color:var(--text3);font-size:13px;line-height:1.7}
.scaffold .big{font-size:30px;margin-bottom:10px}
.muted{color:var(--text3);font-size:11px}
</style>
</head>
<body>

<!-- Password gate -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="logo">Tribute Operating System</div>
    <div class="title" style="font-size:18px">Retention Tracker</div>
    <div class="sub">This dashboard contains caregiver HR records. Enter the team password to continue.</div>
    <input type="password" id="gateInput" placeholder="Password" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')submitGate()">
    <button onclick="submitGate()">Unlock</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<!-- App (hidden until gated) -->
<div id="app" style="display:none">
  <div class="hdr">
    <div>
      <div class="logo">Tribute Operating System</div>
      <div class="title">Caregiver Retention Tracker</div>
      <div class="sub" id="statusLine"><span class="dot"></span>Loading…</div>
    </div>
    <div style="text-align:right">
      <button class="export-btn" onclick="loadAll(true)">⟳ Refresh</button>
    </div>
  </div>

  <div class="nav-tabs" id="navTabs">
    <div class="ntab on" data-tab="roster"   onclick="setTab('roster',this)">Roster</div>
    <div class="ntab"     data-tab="lifecycle"onclick="setTab('lifecycle',this)">Lifecycle</div>
    <div class="ntab"     data-tab="patterns" onclick="setTab('patterns',this)">Why They Leave</div>
    <div class="ntab"     data-tab="atrisk"   onclick="setTab('atrisk',this)">At-Risk</div>
    <div class="ntab"     data-tab="insights" onclick="setTab('insights',this)">Claude Insights</div>
  </div>

  <div id="view"><div class="loading"><div class="spin"></div>Loading retention data…</div></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// CONFIG — runtime-fetched data only; no PII or secrets in this file.
// ─────────────────────────────────────────────────────────────
var API='https://tribute-api-prod-bkc4hfcwf3f2f6bf.centralus-01.azurewebsites.net/api/vivProxy';
var GATE_KEY=null;                 // held in memory + sessionStorage; sent as X-Retention-Key
var terms=[];                      // flattened normalized termination submissions
var curTab='roster';
var sortCol='termDate', sortDir=-1, search='', fMarket='', fType='';
var expanded={};

// ── Gate ──
function submitGate(){
  var v=document.getElementById('gateInput').value.trim();
  if(!v){return}
  GATE_KEY=v;
  try{sessionStorage.setItem('tribute_retention_key',v)}catch(e){}
  document.getElementById('gateErr').textContent='Checking…';
  loadAll(false,true);
}
function showApp(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block'}

// ── Utils ──
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(s){return(s||'').toLowerCase().trim()}
function parseDate(s){
  if(!s)return null;
  var m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);            // MM/DD/YYYY
  if(m)return new Date(+m[3],+m[1]-1,+m[2]);
  var d=new Date(s); return isNaN(d)?null:d;                            // ISO fallback
}
function tenureDays(t){var h=parseDate(t.hiredDate),x=parseDate(t.termDate);if(!h||!x)return null;return Math.round((x-h)/86400000)}
function fmtDate(s){var d=parseDate(s);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}):'—'}
function isInvol(t){return norm(t.termType).indexOf('involunt')===0||norm(t.termType).indexOf('involunt')>-1}
function isRiskHire(t){return /^y/i.test(t.riskHire||'')}

// ── Load ──
async function loadAll(force,fromGate){
  if(!GATE_KEY){try{GATE_KEY=sessionStorage.getItem('tribute_retention_key')}catch(e){}}
  if(!GATE_KEY)return;
  var sl=document.getElementById('statusLine');
  try{
    var res=await fetch(API+'?endpoint=termination_forms'+(force?'&_t='+Date.now():''),
      {headers:{'X-Retention-Key':GATE_KEY}});
    if(res.status===401){
      GATE_KEY=null;try{sessionStorage.removeItem('tribute_retention_key')}catch(e){}
      document.getElementById('gateErr').textContent='Incorrect password.';
      document.getElementById('gate').style.display='flex';document.getElementById('app').style.display='none';
      return;
    }
    if(!res.ok)throw new Error('HTTP '+res.status);
    var d=await res.json();
    showApp();
    terms=[];
    (d.forms||[]).forEach(function(f){(f.submissions||[]).forEach(function(s){terms.push(s)})});
    if(sl)sl.innerHTML='<span class="dot"></span>'+terms.length+' terminations · '+(d.forms||[]).length+' forms · '+new Date().toLocaleTimeString();
    render();
  }catch(e){
    if(fromGate){document.getElementById('gateErr').textContent='Error: '+e.message;return}
    document.getElementById('view').innerHTML='<div class="err">Failed to load: '+esc(e.message)+'</div>';
  }
}

// ── Tabs ──
function setTab(t,el){curTab=t;document.querySelectorAll('.ntab').forEach(function(x){x.classList.remove('on')});el.classList.add('on');render()}
function render(){
  var v=document.getElementById('view');
  if(!terms.length){v.innerHTML='<div class="loading">No termination records loaded.</div>';return}
  if(curTab==='roster')v.innerHTML=renderKPIs()+renderRoster();
  else if(curTab==='lifecycle')v.innerHTML=renderKPIs()+renderLifecycle();
  else if(curTab==='patterns')v.innerHTML=renderKPIs()+renderPatterns();
  else if(curTab==='atrisk')v.innerHTML=renderAtRisk();
  else if(curTab==='insights')v.innerHTML=renderInsights();
}

// ── KPIs ──
function renderKPIs(){
  var n=terms.length;
  var invol=terms.filter(isInvol).length;
  var ten=terms.map(tenureDays).filter(function(x){return x!=null&&x>=0});
  var avgTen=ten.length?Math.round(ten.reduce(function(a,b){return a+b},0)/ten.length):0;
  var risk=terms.filter(isRiskHire).length;
  var ca=terms.filter(function(t){return /^y/i.test(t.correctiveAction||'')}).length;
  function pct(x){return n?Math.round(x/n*100)+'%':'—'}
  return '<div class="kg">'+
    kpi('Terminations',n,'all loaded forms','')+
    kpi('Involuntary',pct(invol),invol+' of '+n,'r')+
    kpi('Avg tenure',avgTen+'d',ten.length+' with dates','b')+
    kpi('Risk-hire flagged',pct(risk),risk+' at onboarding','a')+
    kpi('Had corrective action',pct(ca),ca+' of '+n,'p')+
  '</div>';
}
function kpi(l,v,s,c){return '<div class="kpi"><div class="kl">'+l+'</div><div class="kv '+c+'">'+v+'</div><div class="ks">'+esc(s)+'</div></div>'}

// ── Roster ──
function markets(){var s={};terms.forEach(function(t){if(t.market)s[t.market]=1});return Object.keys(s).sort()}
function types(){var s={};terms.forEach(function(t){if(t.termType)s[t.termType]=1});return Object.keys(s).sort()}
function rosterRows(){
  var rows=terms.filter(function(t){
    if(fMarket&&t.market!==fMarket)return false;
    if(fType&&t.termType!==fType)return false;
    if(search){var hay=norm(t.name+' '+t.market+' '+t.termType+' '+t.standardViolated+' '+t.finalIncident);if(hay.indexOf(norm(search))<0)return false}
    return true;
  });
  rows.sort(function(a,b){
    var x,y;
    if(sortCol==='tenure'){x=tenureDays(a);y=tenureDays(b)}
    else if(sortCol==='hiredDate'||sortCol==='termDate'){x=parseDate(a[sortCol]);y=parseDate(b[sortCol])}
    else{x=norm(a[sortCol]);y=norm(b[sortCol])}
    if(x==null)return 1;if(y==null)return -1;
    return (x<y?-1:x>y?1:0)*sortDir;
  });
  return rows;
}
function renderRoster(){
  var rows=rosterRows();
  var mOpts='<option value="">All markets</option>'+markets().map(function(m){return '<option'+(m===fMarket?' selected':'')+'>'+esc(m)+'</option>'}).join('');
  var tOpts='<option value="">All types</option>'+types().map(function(t){return '<option'+(t===fType?' selected':'')+'>'+esc(t)+'</option>'}).join('');
  var h='<div class="toolbar">'+
    '<input class="srch" placeholder="Search name, market, reason, incident…" value="'+esc(search)+'" oninput="search=this.value;repaint()">'+
    '<select onchange="fMarket=this.value;repaint()">'+mOpts+'</select>'+
    '<select onchange="fType=this.value;repaint()">'+tOpts+'</select>'+
    '<button class="export-btn" onclick="exportCSV()">Export CSV</button>'+
    '<span class="muted">'+rows.length+' shown</span></div>';
  h+='<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    th('Caregiver','name')+th('Market','market')+th('Hired','hiredDate')+th('Termed','termDate')+
    th('Tenure','tenure')+th('Type','termType')+th('Risk hire','riskHire')+'</tr></thead><tbody>';
  rows.forEach(function(t){
    var td=tenureDays(t);
    var typeBadge=t.termType?'<span class="bdg '+(isInvol(t)?'br':'bg')+'">'+esc(t.termType)+'</span>':'—';
    h+='<tr class="cg-row'+(expanded[t.id]?' expanded':'')+'" onclick="toggle(\''+t.id+'\')">'+
      '<td><span class="exp-arrow">▶</span>'+esc(t.name||'(unnamed)')+'</td>'+
      '<td>'+esc(t.market||'—')+'</td>'+
      '<td>'+fmtDate(t.hiredDate)+'</td>'+
      '<td>'+fmtDate(t.termDate)+'</td>'+
      '<td>'+(td!=null?td+'d':'—')+'</td>'+
      '<td style="text-align:right">'+typeBadge+'</td>'+
      '<td>'+(isRiskHire(t)?'<span class="bdg ba">Yes</span>':'<span class="muted">—</span>')+'</td></tr>';
    if(expanded[t.id])h+='<tr><td colspan="7" class="detail">'+detailHTML(t)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
function th(label,col){var arrow=sortCol===col?(sortDir>0?' ▲':' ▼'):'';return '<th onclick="sortBy(\''+col+'\')">'+label+arrow+'</th>'}
function detailHTML(t){
  function row(l,v){return v?'<dt>'+l+'</dt><dd>'+esc(v)+'</dd>':''}
  return '<dl>'+
    row('Standard violated',t.standardViolated)+
    row('Prior incidents?',t.priorIncidents)+
    row('Final incident',t.finalIncident)+
    row('Corrective action?',t.correctiveAction)+
    row('Voluntary notes',t.voluntaryNotes)+
    row('Could Tribute have prevented?',t.preventable)+
    row('Risk hire at onboarding?',t.riskHire)+
    row('Ongoing schedule?',t.ongoingSchedule)+
    row('Tribute Rise level',t.riseLevel)+
    row('Transportation',t.transportation)+
    row('Availability type',t.availabilityType)+
    row('Recorded by',t.author)+
    row('Submitted',t.submittedAt?new Date(t.submittedAt).toLocaleDateString():null)+
  '</dl>';
}
function toggle(id){expanded[id]=!expanded[id];repaint()}
function sortBy(c){if(sortCol===c)sortDir*=-1;else{sortCol=c;sortDir=c==='termDate'||c==='hiredDate'||c==='tenure'?-1:1}repaint()}
function repaint(){if(curTab==='roster')document.getElementById('view').innerHTML=renderKPIs()+renderRoster()}

// ── Lifecycle ──
function renderLifecycle(){
  var buckets=[['0–30d',0,30],['31–60d',31,60],['61–90d',61,90],['91–180d',91,180],['181–365d',181,365],['1yr+',366,99999]];
  var counts=buckets.map(function(){return 0});var withDates=0;
  terms.forEach(function(t){var d=tenureDays(t);if(d==null||d<0)return;withDates++;for(var i=0;i<buckets.length;i++){if(d>=buckets[i][1]&&d<=buckets[i][2]){counts[i]++;break}}});
  var max=Math.max.apply(null,counts.concat([1]));
  var h='<div class="banner"><div class="bl">Tenure at termination</div>How long caregivers lasted from hire to termination ('+withDates+' of '+terms.length+' have both dates). Early clusters point at onboarding/fit; later ones at burnout or schedule erosion.</div>';
  h+='<div class="fc"><div class="ct">Time to termination</div>';
  buckets.forEach(function(b,i){
    var w=Math.round(counts[i]/max*100);
    var cls=i<2?'r':i<4?'a':'g';
    h+='<div class="bar-row"><div>'+b[0]+'</div><div class="bar-track"><div class="bar-fill '+cls+'" style="width:'+w+'%"></div></div><div class="bar-val">'+counts[i]+'</div></div>';
  });
  h+='</div>';
  h+='<div class="muted">Full hire→active→term lifecycle (including still-active caregivers and the bandsProxy 90-day curve) lands when the live roster connection is wired in — this view currently covers terminated caregivers only.</div>';
  return h;
}

// ── Patterns (Why They Leave) ──
function dist(getter){var m={};terms.forEach(function(t){var v=getter(t);if(v==null||v==='')return;v=String(v).trim();m[v]=(m[v]||0)+1});return Object.keys(m).map(function(k){return[k,m[k]]}).sort(function(a,b){return b[1]-a[1]})}
function barCard(title,pairs,colorFn){
  if(!pairs.length)return '';
  var max=pairs[0][1];
  var h='<div class="fc"><div class="ct">'+title+'</div>';
  pairs.forEach(function(p){var w=Math.round(p[1]/max*100);h+='<div class="bar-row"><div title="'+esc(p[0])+'">'+esc(p[0].length>34?p[0].slice(0,33)+'…':p[0])+'</div><div class="bar-track"><div class="bar-fill '+(colorFn?colorFn(p[0]):'')+'" style="width:'+w+'%"></div></div><div class="bar-val">'+p[1]+'</div></div>'});
  return h+'</div>';
}
function renderPatterns(){
  var h='<div class="banner"><div class="bl">Why caregivers leave</div>Categorical breakdowns straight from the termination forms. Claude-surfaced themes from the free-text incident notes arrive in the Insights tab.</div>';
  h+=barCard('Termination type',dist(function(t){return t.termType}),function(k){return /involunt/i.test(k)?'r':'g'});
  h+=barCard('Tribute standard violated',dist(function(t){return t.standardViolated}),function(){return 'r'});
  h+=barCard('By market',dist(function(t){return t.market}),function(){return 'b'});
  h+=barCard('Risk hire at onboarding',dist(function(t){return t.riskHire}),function(k){return /^y/i.test(k)?'a':'g'});
  h+=barCard('Transportation to visits',dist(function(t){return t.transportation}),function(){return 'b'});
  h+=barCard('Tribute Rise level',dist(function(t){return t.riseLevel}),function(){return 'b'});
  return h;
}

// ── At-Risk (Phase scaffold) ──
function renderAtRisk(){
  var risk=terms.filter(isRiskHire).length, invol=terms.filter(isInvol).length, n=terms.length;
  var topStd=dist(function(t){return t.standardViolated}).slice(0,3);
  var h='<div class="banner w" style="border-left-color:var(--amber)"><div class="bl" style="color:var(--amber)">What we know so far</div>'+
    'Live at-risk scoring needs the active-caregiver roster (caregiver_hours / bandsProxy) + the call-outreach CSV + Claude scoring — those land in the next phases. Meanwhile, the risk signals learned from past terminations:</div>';
  h+='<div class="kg">'+
    kpi('Involuntary share',n?Math.round(invol/n*100)+'%':'—','of all exits','r')+
    kpi('Were risk-hires',n?Math.round(risk/n*100)+'%':'—','flagged at onboarding','a')+
    kpi('Top violated standard',topStd[0]?topStd[0][1]:'—',topStd[0]?topStd[0][0]:'—','b')+
  '</div>';
  h+='<div class="scaffold"><div class="big">🎯</div>The watchlist ranks <b>active</b> caregivers by these signals (risk-hire flag, low outreach count, tenure band, schedule erosion). It activates once the active roster + call CSV are connected.</div>';
  return h;
}

// ── Insights (Claude — Phase scaffold) ──
function renderInsights(){
  return '<div class="banner"><div class="bl">Claude insights</div>Precomputed termination-pattern themes and per-caregiver risk narratives, generated by the claudeProxy batch job and cached. This tab reads those cached results.</div>'+
    '<div class="scaffold"><div class="big">🧠</div>No cached insights yet. Once the Claude batch job runs over the termination notes, this tab shows the surfaced themes (e.g. recurring root causes in the free-text incident fields) and a plain-language risk summary per active caregiver.</div>';
}

// ── Export ──
function exportCSV(){
  var cols=['name','market','hiredDate','termDate','tenureDays','termType','standardViolated','priorIncidents','correctiveAction','riskHire','riseLevel','transportation','finalIncident','preventable','author'];
  var rows=rosterRows().map(function(t){var o={};cols.forEach(function(c){o[c]=c==='tenureDays'?tenureDays(t):t[c]});return o});
  var csv=Papa.unparse(rows);
  var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='caregiver_terminations_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

// ── Boot ──
(function(){
  var saved=null;try{saved=sessionStorage.getItem('tribute_retention_key')}catch(e){}
  if(saved){GATE_KEY=saved;loadAll(false,false)}
})();
</script>
