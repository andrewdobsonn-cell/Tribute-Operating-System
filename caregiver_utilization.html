<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script src="./entra-auth.js?v=2026-07-07b"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caregiver Utilization — Tribute OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#E8541A;--orange-dark:#C4441A;--orange-light:#F47A4A;--orange-pale:#FDF2ED;--orange-50:#FEF8F5;
  --charcoal:#2C2C2C;--charcoal-mid:#4A4A4A;--gray-text:#6B6B6B;--gray-light:#9B9B9B;
  --gray-100:#F5F5F5;--gray-200:#EBEBEB;--gray-300:#D8D8D8;--white:#FFFFFF;--cream:#FAFAF8;
  --green:#3DAA7A;--green-light:#dcfce7;--green-text:#166534;
  --red:#E05252;--red-light:#fee2e2;--red-text:#991b1b;
  --yellow:#d97706;--yellow-light:#fef3c7;--yellow-text:#92400e;
  --blue:#2563eb;--blue-light:#dbeafe;--blue-text:#1e40af;
  --purple:#7c3aed;--purple-light:#ede9fe;--purple-text:#5b21b6;
  --cyan:#0891b2;--cyan-light:#cffafe;
  --navy:#0F2647;--slate:#44546A;
  --shadow-sm:0 1px 4px rgba(44,44,44,0.06),0 1px 2px rgba(44,44,44,0.04);
  --shadow-md:0 4px 20px rgba(44,44,44,0.09),0 2px 6px rgba(44,44,44,0.05);
  --r:10px;--rl:14px;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cream);color:var(--charcoal);min-height:100vh;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

.topbar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:0 48px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.topbar-brand{display:flex;align-items:baseline}
.topbar-tribute{font-family:'DM Serif Display',Georgia,serif;font-size:22px;color:var(--orange)}
.topbar-sub{font-size:11px;color:var(--gray-text);margin-left:4px}
.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-back{color:var(--gray-text);text-decoration:none;font-size:12px;font-weight:500;display:flex;align-items:center;gap:4px;transition:color .2s}
.topbar-back:hover{color:var(--orange)}
.topbar-live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray-text)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.hero{background:var(--white);padding:36px 48px 32px;border-bottom:1px solid var(--gray-200);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--orange)}
.hero-eyebrow{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:8px;padding-left:20px}
.hero-title{font-family:'DM Serif Display',Georgia,serif;font-size:34px;color:var(--charcoal);line-height:1.1;letter-spacing:-.025em;margin-bottom:8px;padding-left:20px}
.hero-title span{color:var(--orange);font-style:italic}
.hero-sub{font-size:14px;font-weight:300;color:var(--gray-text);padding-left:20px;max-width:700px}

.stats-strip{background:var(--orange);padding:12px 48px;display:flex;gap:36px;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column;gap:2px}
.stat-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.65)}
.stat-value{font-size:20px;font-weight:500;color:var(--white);font-variant-numeric:tabular-nums}

.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tab-bar{display:flex;gap:4px;padding:16px 48px 0;flex-wrap:wrap}
.tab-btn{background:var(--white);border:1px solid var(--gray-200);border-radius:8px 8px 0 0;padding:10px 18px;font-size:12px;font-weight:600;color:var(--gray-text);cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit;border-bottom:none}
.tab-btn:hover{border-color:var(--orange-light);color:var(--charcoal)}
.tab-btn.active{background:var(--white);border-color:var(--orange);color:var(--orange);position:relative}

.content{padding:0 48px 48px;max-width:1600px;margin:0 auto}
.section{display:none}.section.active{display:block;padding-top:24px}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--rl);padding:16px 20px;box-shadow:var(--shadow-sm)}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-light);margin-bottom:4px}
.kpi-value{font-size:24px;font-weight:600;color:var(--charcoal)}
.kpi-value.green{color:var(--green)}.kpi-value.red{color:var(--red)}.kpi-value.yellow{color:var(--yellow)}.kpi-value.orange{color:var(--orange)}.kpi-value.blue{color:var(--blue)}.kpi-value.purple{color:var(--purple)}
.kpi-sub{font-size:10px;color:var(--gray-light);margin-top:3px}

.table-wrap{overflow-x:auto;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--rl);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--gray-100);color:var(--gray-text);font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:10px 12px;text-align:left;position:sticky;top:0;border-bottom:1px solid var(--gray-200);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--charcoal)}
thead th.sorted-asc::after{content:' \u25B2';color:var(--orange)}
thead th.sorted-desc::after{content:' \u25BC';color:var(--orange)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--gray-100);color:var(--charcoal);white-space:nowrap;font-size:13px}
tbody tr:hover{background:var(--orange-50)}
tbody tr:nth-child(even){background:var(--gray-100)}
tbody tr:nth-child(even):hover{background:var(--orange-50)}

.util-bar{display:flex;align-items:center;gap:6px}
.util-track{width:70px;height:6px;background:var(--gray-200);border-radius:3px;overflow:hidden;flex-shrink:0}
.util-fill{height:100%;border-radius:3px}
.util-pct{font-size:11px;font-weight:600;min-width:36px}
.u-green .util-fill{background:var(--green)}.u-green .util-pct{color:var(--green)}
.u-yellow .util-fill{background:var(--yellow)}.u-yellow .util-pct{color:var(--yellow)}
.u-red .util-fill{background:var(--red)}.u-red .util-pct{color:var(--red)}
.u-over .util-fill{background:var(--orange)}.u-over .util-pct{color:var(--orange)}

.type-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.type-long{background:var(--yellow-light);color:var(--yellow-text)}
.type-overnight{background:var(--purple-light);color:var(--purple-text)}
.type-short{background:var(--blue-light);color:var(--blue-text)}
.type-livein{background:var(--cyan-light);color:var(--cyan)}

.filter-bar{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--rl);padding:14px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px;min-width:110px}
.filter-group label,.fl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-light)}
.filter-group select,.filter-group input,.filter-bar select,.filter-bar input{background:var(--gray-100);border:1px solid var(--gray-200);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:12px;color:var(--charcoal);outline:none;transition:border-color .15s}
.filter-group select:focus,.filter-group input:focus,.filter-bar select:focus,.filter-bar input:focus{border-color:var(--orange)}
.fl{margin-right:-6px;align-self:center}

.ts{font-size:12px;color:var(--gray-light);margin-bottom:16px;font-weight:500}
.sev-alert{color:var(--red);font-weight:700}.sev-warning{color:var(--orange);font-weight:600}.sev-info{color:var(--gray-text)}
.gap-low{color:var(--gray-text)}.gap-med{color:var(--yellow);font-weight:600}.gap-high{color:var(--orange);font-weight:700}
.payout-ok{color:var(--green)}.payout-warn{color:var(--yellow);font-weight:600}.payout-high{color:var(--red);font-weight:700}

@media(max-width:900px){.content,.tab-bar,.topbar,.hero,.stats-strip{padding-left:16px;padding-right:16px}.kpi-row{grid-template-columns:repeat(2,1fr)}.hero-title{font-size:24px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-brand"><span class="topbar-tribute">Tribute</span><span class="topbar-sub">Caregiver Utilization</span></div>
  <div class="topbar-right">
    <div class="topbar-live"><div class="live-dot"></div>Live Data</div>
    <a href="index.html" class="topbar-back">&larr; Back to Dashboard</a>
  </div>
</div>
<div class="hero">
  <div class="hero-eyebrow">Workforce Analytics</div>
  <div class="hero-title">Caregiver <span>Utilization</span></div>
  <div class="hero-sub">Real-time utilization tracking across all markets, matching the original report methodology with adjusted capacity and capped utilization calculations.</div>
</div>
<div id="stats-strip" class="stats-strip" style="display:none"></div>
<div id="loading" class="loading-wrap"><div class="spinner"></div><div style="color:var(--gray-text);font-size:13px">Loading utilization data...</div></div>
<div id="app" style="display:none">
<div class="tab-bar">
  <button class="tab-btn active" data-tab="dash">Dashboard</button>
  <button class="tab-btn" data-tab="market">Market Summary</button>
  <button class="tab-btn" data-tab="state">State Summary</button>
  <button class="tab-btn" data-tab="detail">Caregiver Detail</button>
  <button class="tab-btn" data-tab="daybreak">Day Breakdown</button>
  <button class="tab-btn" data-tab="roster">Caregiver Roster</button>
  <button class="tab-btn" data-tab="ts">TS Admin Tracker</button>
  <button class="tab-btn" data-tab="travel">Travel Time</button>
  <button class="tab-btn" data-tab="lhon">Long Hrs &amp; Overnights</button>
  <button class="tab-btn" data-tab="shiftmix">Shift Mix</button>
  <button class="tab-btn" data-tab="newhires">New Hires 90 Days</button>
  <button class="tab-btn" data-tab="validation">Validation</button>
</div>
<div class="content">
  <div id="tab-dash" class="section active"></div>
  <div id="tab-market" class="section"></div>
  <div id="tab-state" class="section"></div>
  <div id="tab-detail" class="section"></div>
  <div id="tab-daybreak" class="section"></div>
  <div id="tab-roster" class="section"></div>
  <div id="tab-ts" class="section"></div>
  <div id="tab-travel" class="section"></div>
  <div id="tab-lhon" class="section"></div>
  <div id="tab-shiftmix" class="section"></div>
  <div id="tab-newhires" class="section"></div>
  <div id="tab-validation" class="section"></div>
</div>
</div>
<script>
(function(){
'use strict';
var API='https://tribute-api-prod-bkc4hfcwf3f2f6bf.centralus-01.azurewebsites.net/api/vivProxy';
var MKT_ORDER=['Boston','North of Boston','MetroWest Boston','South of Boston','Chicago','Annapolis','Baltimore','Bethesda'];
var D;

function $(s,p){return(p||document).querySelector(s);}
function $$(s,p){return Array.from((p||document).querySelectorAll(s));}
function fmt(n,d){return n==null?'—':Number(n).toLocaleString(undefined,{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function fmtPct(n){return n==null?'—':fmt(n,1)+'%';}
function fmtDol(n){return n==null?'—':'$'+fmt(n,0);}
function utilClass(p){return p>110?'u-over':p>=80?'u-green':p>=50?'u-yellow':'u-red';}
function utilBar(p){
  if(p==null)return '—';
  var cls=utilClass(p);
  return '<div class="util-bar '+cls+'"><div class="util-track"><div class="util-fill" style="width:'+Math.min(p,100)+'%"></div></div><span class="util-pct">'+fmtPct(p)+'</span></div>';
}
function typeBadge(t){
  var m={'Long Hours':'type-long','Overnight':'type-overnight','Short Hours':'type-short','Live-In':'type-livein','Hourly':'type-short','Live-In / Long Hours':'type-long','Live-In / Overnight':'type-overnight','PRN Worked':'type-short'};
  return '<span class="type-badge '+(m[t]||'type-short')+'">'+t+'</span>';
}
function gapClass(h){return h>=1.5?'gap-high':h>=0.5?'gap-med':'gap-low';}
function payoutClass(h){return h>=15?'payout-high':h>=5?'payout-warn':'payout-ok';}

function buildTable(container, columns, rows, opts){
  opts=opts||{};
  var sortCol=opts.defaultSort||0, sortAsc=opts.defaultAsc!==undefined?opts.defaultAsc:true;
  var wrapper=document.createElement('div');
  wrapper.className='table-wrap';
  if(opts.maxHeight) wrapper.style.cssText='max-height:'+opts.maxHeight+';overflow-y:auto';
  var tbl=document.createElement('table');
  var thead=document.createElement('thead');
  var tbody=document.createElement('tbody');
  tbl.appendChild(thead);tbl.appendChild(tbody);wrapper.appendChild(tbl);
  container.appendChild(wrapper);
  function render(){
    var sorted=rows.slice().sort(function(a,b){
      var av=columns[sortCol].val?columns[sortCol].val(a):a[columns[sortCol].key];
      var bv=columns[sortCol].val?columns[sortCol].val(b):b[columns[sortCol].key];
      if(av==null)av=sortAsc?Infinity:-Infinity;
      if(bv==null)bv=sortAsc?Infinity:-Infinity;
      if(typeof av==='string')av=av.toLowerCase();
      if(typeof bv==='string')bv=bv.toLowerCase();
      return sortAsc?(av>bv?1:av<bv?-1:0):(av<bv?1:av>bv?-1:0);
    });
    thead.innerHTML='<tr>'+columns.map(function(c,i){
      var cls=i===sortCol?(sortAsc?'sorted-asc':'sorted-desc'):'';
      return '<th class="'+cls+'" data-ci="'+i+'">'+c.label+'</th>';
    }).join('')+'</tr>';
    tbody.innerHTML=sorted.map(function(row){
      return '<tr>'+columns.map(function(c){
        var v=c.render?c.render(row):(row[c.key]!=null?row[c.key]:'—');
        return '<td>'+v+'</td>';
      }).join('')+'</tr>';
    }).join('');
    $$('th',thead).forEach(function(th){
      th.onclick=function(){
        var ci=parseInt(th.dataset.ci);
        if(ci===sortCol)sortAsc=!sortAsc;
        else{sortCol=ci;sortAsc=true;}
        render();
      };
    });
  }
  render();
  return {render:render,setRows:function(r){rows=r;render();}};
}

function kpi(label,value,cls,sub){
  return '<div class="kpi"><div class="kpi-label">'+label+'</div><div class="kpi-value '+(cls||'')+'">'+value+'</div>'+(sub?'<div class="kpi-sub">'+sub+'</div>':'')+'</div>';
}

$$('.tab-btn').forEach(function(btn){
  btn.onclick=function(){
    $$('.tab-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    $$('.section').forEach(function(s){s.classList.remove('active');});
    var t=$('#tab-'+btn.dataset.tab);
    if(t)t.classList.add('active');
  };
});

fetch(API+'?endpoint=utilization_report').then(function(r){return r.json();}).then(function(data){
  D=data;
  $('#loading').style.display='none';
  $('#app').style.display='block';
  // Stats strip
  var s=D.summary;
  var strip=$('#stats-strip');
  strip.style.display='flex';
  strip.innerHTML=
    '<div class="stat-item"><div class="stat-label">Overall Util</div><div class="stat-value">'+fmtPct(s.overallUtilPct)+'</div></div>'+
    '<div class="stat-item"><div class="stat-label">Active CGs</div><div class="stat-value">'+fmt(s.activeCount||s.activeCaregivers)+'</div></div>'+
    '<div class="stat-item"><div class="stat-label">Adj Capacity</div><div class="stat-value">'+fmt(s.totalAdjCap||0,0)+'</div></div>'+
    '<div class="stat-item"><div class="stat-label">Hrs Worked</div><div class="stat-value">'+fmt(s.totalWorkedHrs||0,0)+'</div></div>'+
    '<div class="stat-item"><div class="stat-label">Revenue</div><div class="stat-value">'+fmtDol(s.totalRevenue)+'</div></div>'+
    '<div class="stat-item"><div class="stat-label">Gross Margin</div><div class="stat-value">'+fmt(s.grossMarginPct,1)+'%</div></div>'+
    '<div class="stat-item"><div class="stat-label">Week Of</div><div class="stat-value">'+D.weekOf+'</div></div>';
  renderDashboard();
  renderMarketSummary();
  renderStateSummary();
  renderCaregiverDetail();
  renderDayBreakdown();
  renderRoster();
  renderTSAdmin();
  renderTravelTime();
  renderLHON();
  renderShiftMix();
  renderNewHires();
  renderValidation();
}).catch(function(e){
  $('#loading').innerHTML='<div style="color:var(--red)">Error loading data: '+e.message+'</div>';
});

// ── DASHBOARD ──
function renderDashboard(){
  var el=$('#tab-dash');var s=D.summary;
  el.innerHTML='<div class="ts">Week of '+D.weekOf+' to '+D.weekEnd+' &middot; Generated '+new Date(D.generatedAt).toLocaleString()+'</div>';
  el.innerHTML+='<div class="kpi-row">'+
    kpi('Active Caregivers',fmt(s.activeCaregivers)+' / '+fmt(s.totalCaregivers),'','Active: '+fmt(s.activeCount||0)+' | PRN: '+fmt(s.prnCount||0)+' | PTO: '+fmt(s.ptoCount||0))+
    kpi('Overall Utilization',fmtPct(s.overallUtilPct),s.overallUtilPct>=80?'green':s.overallUtilPct>=50?'yellow':'red','Adj Cap: '+fmt(s.totalAdjCap||0,1))+
    kpi('Hrs Worked',fmt(s.totalWorkedHrs||s.totalScheduledHrs,1)+' hrs','','Desired: '+fmt(s.totalDesiredHrs,1))+
    kpi('Total Billed',fmt(s.totalBilledHrs,1)+' hrs','blue')+
    kpi('Revenue',fmtDol(s.totalRevenue),'green')+
    kpi('Cost',fmtDol(s.totalCost),'red')+
    kpi('Gross Profit',fmtDol(s.grossProfit),'green',fmt(s.grossMarginPct,1)+'% margin')+
    kpi('Travel Gaps',fmt(s.travelGapCount),'orange')+
    kpi('TS Admin Payouts',fmt(s.tsAdminCount),'yellow')+
    kpi('New Hires (90d)',fmt(s.newHireCount),'blue')+
    kpi('Validation Flags',fmt(s.validationCount),s.validationCount>0?'orange':'green')+
  '</div>';
  var h='<div class="table-wrap"><table><thead><tr><th>Market</th><th>CGs</th><th>Adj Cap</th><th>Worked</th><th>Util %</th><th>Over 100%</th><th>Zero Util</th><th>Revenue</th><th>Gross Margin</th></tr></thead><tbody>';
  D.marketSummary.sort(function(a,b){return MKT_ORDER.indexOf(a.market)-MKT_ORDER.indexOf(b.market);}).forEach(function(m){
    var gmCls=m.grossMarginPct>=0.4?'green':m.grossMarginPct>=0.3?'yellow':'red';
    var uCls=(m.utilPct||0)>=80?'green':(m.utilPct||0)>=50?'yellow':'red';
    h+='<tr><td><strong>'+m.market+'</strong></td><td>'+fmt(m.cgCount||0)+'</td><td>'+fmt(m.totalAdjCap||0,1)+'</td><td>'+fmt(m.totalWorked||0,1)+'</td><td style="color:var(--'+uCls+');font-weight:600">'+fmtPct(m.utilPct||0)+'</td><td>'+(m.overCount||0)+'</td><td>'+(m.zeroCount||0)+'</td><td>'+fmtDol(m.revenue)+'</td><td style="color:var(--'+gmCls+');font-weight:600">'+fmtPct(m.grossMarginPct*100)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  el.innerHTML+=h;
}

// ── MARKET SUMMARY ──
function renderMarketSummary(){
  var el=$('#tab-market');
  el.innerHTML='<div class="ts">Week of '+D.weekOf+'</div>';
  var summaryRows=[];
  D.marketSummary.sort(function(a,b){return MKT_ORDER.indexOf(a.market)-MKT_ORDER.indexOf(b.market);}).forEach(function(m){
    summaryRows.push({label:m.market,svcType:'Active Caregivers',count:m.cgCount||0,desired:m.totalDesired||0,adjCap:m.totalAdjCap||0,worked:m.totalWorked||0,utilPct:m.utilPct,overCount:m.overCount||0,zeroCount:m.zeroCount||0,workingCount:m.workingCount||0,isOverall:true});
    if(m.typeBreakdown){m.typeBreakdown.forEach(function(t){
      summaryRows.push({label:'',svcType:'  '+t.type,count:t.count,desired:t.desired,adjCap:t.adjCap,worked:t.worked,utilPct:t.utilPct,overCount:t.overCount,zeroCount:t.zeroCount,workingCount:t.count-t.zeroCount,isOverall:false});
    });}
    if(m.prnCount>0)summaryRows.push({label:'',svcType:'  PRN Worked',count:m.prnCount,desired:0,adjCap:0,worked:m.prnWorked||0,utilPct:null,overCount:0,zeroCount:0,workingCount:m.prnCount,isOverall:false,isPRN:true});
    if(m.ptoCount>0)summaryRows.push({label:'',svcType:'  On PTO',count:m.ptoCount,desired:0,adjCap:0,worked:0,utilPct:null,overCount:0,zeroCount:0,workingCount:0,isOverall:false,isPTO:true});
  });
  var cols=[
    {label:'Market',key:'label',render:function(r){return r.isOverall?'<strong>'+r.label+'</strong>':'';}},

    kpi('Info',fmt(D.validation.filter(function(v){return v.severity==='Info';}).length),'blue')+
    '</div>';
  var cols=[
    {label:'Severity',key:'severity',render:function(r){return '<span class="sev-'+r.severity.toLowerCase()+'">'+r.severity+'</span>';}},
    {label:'Type',key:'type'},
    {label:'Name',key:'name'},
    {label:'Market',key:'market'},
    {label:'Value',key:'value'},
    {label:'Detail',key:'detail'}
  ];
  buildTable(el,cols,D.validation,{defaultSort:0,maxHeight:'65vh'});
}

})();
</script>
</body>
