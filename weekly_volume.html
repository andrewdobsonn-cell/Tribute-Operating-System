<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script src="./entra-auth.js?v=2026-07-07c"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tribute — Weekly Volume</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f7f7f5;--bg3:#ededea;--text:#1a1a18;--text2:#6b6b67;--text3:#9e9c96;--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);--green:#1D9E75;--amber:#EF9F27;--red:#E24B4A;--blue:#185FA5;--purple:#7B4FBE;--green-bg:#E1F5EE;--amber-bg:#FAEEDA;--red-bg:#FCEBEB;--blue-bg:#E6F1FB;--green-text:#0F6E56;--amber-text:#633806;--red-text:#791F1F;--blue-text:#0C447C;--r:8px;--rl:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--bg2:#232320;--bg3:#2c2c29;--text:#e8e6e0;--text2:#9e9c96;--text3:#6b6b67;--border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);--green-bg:#04342C;--amber-bg:#412402;--red-bg:#501313;--blue-bg:#042C53;--green-text:#9FE1CB;--amber-text:#FAC775;--red-text:#F09595;--blue-text:#85B7EB}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:20px;max-width:1200px;margin:0 auto;font-size:14px;line-height:1.5}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:.5px solid var(--border);margin-bottom:16px;flex-wrap:wrap;gap:10px}
.logo{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.title{font-size:22px;font-weight:500;margin-top:3px}
.sub{font-size:11px;color:var(--text3);margin-top:2px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.period-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.period-label{font-size:11px;color:var(--text3);margin-right:4px;white-space:nowrap}
.pbtn{font-size:11px;font-weight:500;padding:5px 12px;border-radius:20px;cursor:pointer;border:.5px solid var(--border2);color:var(--text2);background:var(--bg2);user-select:none;white-space:nowrap}
.pbtn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tabs{display:flex;border-bottom:.5px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{font-size:12px;font-weight:500;color:var(--text2);padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-.5px;white-space:nowrap;user-select:none}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.kg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:800px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--bg2);border-radius:var(--r);padding:14px 16px}
.kl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin-bottom:6px}
.kv{font-size:24px;font-weight:500;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.ks{font-size:11px;color:var(--text3)}
.kv.g{color:var(--green)}.kv.b{color:var(--blue)}.kv.a{color:var(--amber)}.kv.r{color:var(--red)}.kv.p{color:var(--purple)}
.kt{font-size:11px;margin-top:4px}.kt.up{color:var(--green)}.kt.dn{color:var(--red)}.kt.fl{color:var(--text3)}
.fc{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:12px}
.ct{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);padding:7px 10px;border-bottom:.5px solid var(--border2);text-align:right}
.tbl th:first-child{text-align:left}
.tbl td{padding:9px 10px;border-bottom:.5px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
.tbl td:first-child{text-align:left;font-weight:500}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tfoot td{border-top:.5px solid var(--border2);font-weight:500;padding:9px 10px;text-align:right}
.tbl tfoot td:first-child{text-align:left}
.bdg{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block}
.bg{background:var(--green-bg);color:var(--green-text)}.ba{background:var(--amber-bg);color:var(--amber-text)}.br{background:var(--red-bg);color:var(--red-text)}.bb{background:var(--blue-bg);color:var(--blue-text)}
.mbr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--border)}
.mbr:last-child{border-bottom:none}
.mbl{font-size:12px;color:var(--text);width:150px;flex-shrink:0}
.mbt{flex:1;height:14px;background:var(--bg3);border-radius:2px;overflow:hidden}
.mbf{height:100%;border-radius:2px}
.mbv{font-size:12px;font-weight:500;width:80px;text-align:right;flex-shrink:0}
.ftr{margin-top:32px;padding-top:14px;border-top:.5px solid var(--border);font-size:11px;color:var(--text3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ctrl-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
select.geo-sel{font-size:11px;padding:5px 10px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text)}
.tgl{display:flex;gap:0;border:.5px solid var(--border2);border-radius:20px;overflow:hidden}
.tgl-btn{font-size:11px;padding:5px 12px;cursor:pointer;background:var(--bg2);color:var(--text2);user-select:none}
.tgl-btn.on{background:var(--text);color:var(--bg)}
.scroll-wrap{overflow-x:auto}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="logo">Tribute Home Care</div>
    <div class="title">Weekly Volume</div>
    <div class="sub" id="sl"><span class="dot"></span>Data loaded from embedded dataset</div>
  </div>
</div>

<div class="period-bar">
  <span class="period-label">Period:</span>
  <div class="pbtn" onclick="setPeriod(13,this)">13 weeks</div>
  <div class="pbtn on" onclick="setPeriod(26,this)">26 weeks</div>
  <div class="pbtn" onclick="setPeriod(52,this)">52 weeks</div>
  <div class="pbtn" onclick="setPeriod('ytd',this)">YTD</div>
  <div class="pbtn" onclick="setPeriod('all',this)">All time</div>
</div>

<div class="ctrl-row">
  <select class="geo-sel" id="geoSel" onchange="render()">
    <option value="all">All Markets</option>
    <optgroup label="States">
      <option value="Massachusetts">Massachusetts</option>
      <option value="Maryland">Maryland</option>
      <option value="Illinois">Illinois</option>
      <option value="Virginia">Virginia</option>
    </optgroup>
    <optgroup label="Markets">
      <option value="Annapolis">Annapolis</option>
      <option value="Baltimore">Baltimore</option>
      <option value="Bethesda">Bethesda</option>
      <option value="Boston">Boston</option>
      <option value="Chicago">Chicago</option>
      <option value="MetroWest Boston">MetroWest Boston</option>
      <option value="North of Boston">North of Boston</option>
      <option value="Northern New Jersey">Northern New Jersey</option>
      <option value="Northern Virginia">Northern Virginia</option>
      <option value="South of Boston">South of Boston</option>
    </optgroup>
  </select>
  <div class="tgl">
    <div class="tgl-btn on" onclick="setMode('converted',this)">Converted Hours</div>
    <div class="tgl-btn" onclick="setMode('raw',this)">Raw Hours</div>
  </div>
</div>

<div class="tabs">
  <div class="tab on" onclick="setTab('hours',this)">Hours of Service</div>
  <div class="tab" onclick="setTab('revenue',this)">Revenue</div>
  <div class="tab" onclick="setTab('monthly',this)">Monthly</div>
  <div class="tab" onclick="setTab('summary',this)">Summary</div>
  <div class="tab" onclick="setTab('validation',this)">Validation</div>
</div>

<div id="ct"></div>

<div class="ftr">
  <span>Weekly Volume Dashboard &mdash; Tribute Home Care</span>
  <span id="ts"></span>
</div>

<script>
const WEEKLY_DATA = []; // no longer seeded here -- fetched live via endpoint=weekly_volume_historical in init() below; removed 2026-07-09 (was downloadable via view-source regardless of the page's sign-in gate).
const MONTHLY_DATA = []; // same as above -- see init().


const STATE_ROLLUPS={
  'Massachusetts':['Boston','MetroWest Boston','North of Boston','South of Boston','Massachusetts'],
  'Maryland':['Annapolis','Baltimore','Bethesda','Maryland'],
  'Illinois':['Chicago','Illinois'],
  'Virginia':['Northern Virginia','Virginia']
};
const ALL_INDIVIDUAL_GEOS=['Annapolis','Baltimore','Bethesda','Boston','Chicago','MetroWest Boston','North of Boston','Northern New Jersey','Northern Virginia','South of Boston'];

let currentPeriod=26;
let currentTab='hours';
let currentMode='converted';
let weeklyRows=[];
let monthlyRows=[];

var API='https://tribute-api-prod-bkc4hfcwf3f2f6bf.centralus-01.azurewebsites.net/api/vivProxy';

// weekly_volume is now Entra-gated end to end (2026-07-09 — the non-debug
// response was live with zero auth until today, same gap class as tier1.html).
async function _authFetch(url, opts) {
  opts = opts || {};
  var t = (window.tributeKsfGate && window.tributeKsfGate.getToken) ? await window.tributeKsfGate.getToken() : null;
  if (t) { opts = Object.assign({}, opts); opts.headers = Object.assign({}, opts.headers || {}, {Authorization: 'Bearer ' + t}); }
  return fetch(url, opts);
}

function getSunday(d){var dt=new Date(d);dt.setDate(dt.getDate()-dt.getDay());return dt.toISOString().split('T')[0];}

async function init(){
  // Historical rows (2022 -> last complete week) used to be pasted directly
  // into this page as WEEKLY_DATA/MONTHLY_DATA consts — downloadable via
  // view-source regardless of the page's Entra sign-in gate. Now fetched
  // from a real gated endpoint instead (weekly_volume_historical).
  document.getElementById('sl').innerHTML='<span class="dot"></span>Loading historical data...';
  try{
    var histRes=await _authFetch(API+'?endpoint=weekly_volume_historical');
    if(!histRes.ok)throw new Error('historical API returned '+histRes.status);
    var hist=await histRes.json();
    weeklyRows=hist.weekly.map(function(r){return{geo:r[0],shiftType:r[1],startOfWeek:r[2],totalRevenue:r[3],billableHours:r[4]};});
    monthlyRows=hist.monthly.map(function(r){return{geo:r[0],shiftType:r[1],startOfMonth:r[2],totalRevenue:r[3],billableHours:r[4]};});
    // Only keep past weeks from the historical set — current + future come from Viv
    var thisWeek=getSunday(new Date());
    weeklyRows=weeklyRows.filter(function(r){return r.startOfWeek<thisWeek;});
    monthlyRows=monthlyRows.filter(function(r){return r.startOfMonth<thisWeek;});
    document.getElementById('ts').textContent='Last updated: '+new Date().toLocaleDateString();
    render();
  }catch(e){
    console.warn('Historical fetch error:',e.message);
    document.getElementById('sl').innerHTML='<span class="dot"></span>Could not load historical data &middot; '+e.message;
    return;
  }
  // Fetch current + future weeks from Viv API
  fetchLiveData();
}

async function fetchLiveData(){
  try{
    var thisWeek=getSunday(new Date());
    // Fetch current week + next 4 weeks from Viv
    var endDate=new Date(thisWeek+'T00:00:00');
    endDate.setDate(endDate.getDate()+28);
    var endStr=endDate.toISOString().split('T')[0];
    document.getElementById('sl').innerHTML='<span class="dot"></span>Fetching current &amp; future weeks from Viv...';
    var res=await _authFetch(API+'?endpoint=weekly_volume&startWeek='+thisWeek+'&endWeek='+endStr);
    if(!res.ok)throw new Error('API returned '+res.status);
    var data=await res.json();
    if(data.weekly&&data.weekly.length>0){
      weeklyRows=weeklyRows.concat(data.weekly);
      document.getElementById('sl').innerHTML='<span class="dot"></span>Live &middot; historical from CSV, current + future from Viv';
      render();
    }else{
      document.getElementById('sl').innerHTML='<span class="dot"></span>Historical data loaded &middot; no scheduled visits for current/future weeks';
    }
  }catch(e){
    console.warn('Live fetch error:',e.message);
    document.getElementById('sl').innerHTML='<span class="dot"></span>Historical data only &middot; Viv fetch failed';
  }
}

function setPeriod(p,el){
  currentPeriod=p;
  document.querySelectorAll('.period-bar .pbtn').forEach(function(b){b.classList.remove('on');});
  el.classList.add('on');
  render();
}
function setTab(t,el){
  currentTab=t;
  document.querySelectorAll('.tabs .tab').forEach(function(b){b.classList.remove('on');});
  el.classList.add('on');
  render();
}
function setMode(m,el){
  currentMode=m;
  document.querySelectorAll('.tgl .tgl-btn').forEach(function(b){b.classList.remove('on');});
  el.classList.add('on');
  render();
}

function getFilteredWeeks(){
  var allWeeks=Array.from(new Set(weeklyRows.map(function(r){return r.startOfWeek;}))).sort();
  if(currentPeriod==='all')return allWeeks;
  if(currentPeriod==='ytd'){
    var yr=new Date().getFullYear()+'-01-01';
    return allWeeks.filter(function(w){return w>=yr;});
  }
  return allWeeks.slice(-currentPeriod);
}

function getFilteredMonths(){
  var allMonths=Array.from(new Set(monthlyRows.map(function(r){return r.startOfMonth;}))).sort();
  if(currentPeriod==='all')return allMonths;
  if(currentPeriod==='ytd'){
    var yr=new Date().getFullYear()+'-01-01';
    return allMonths.filter(function(m){return m>=yr;});
  }
  var monthCount=Math.ceil((typeof currentPeriod==='number'?currentPeriod:52)/4.33);
  return allMonths.slice(-monthCount);
}

function getGeoFilter(){
  var sel=document.getElementById('geoSel').value;
  if(sel==='all')return null;
  if(STATE_ROLLUPS[sel])return STATE_ROLLUPS[sel];
  return[sel];
}

function convertHours(hours,shiftType){
  if(currentMode==='raw')return hours;
  return shiftType==='Live-In'?hours*2/3:hours;
}

function aggregateWeekly(weeks,geoFilter){
  var byWeek={};
  weeks.forEach(function(w){byWeek[w]={hours:0,revenue:0};});
  weeklyRows.forEach(function(r){
    if(!byWeek[r.startOfWeek])return;
    if(geoFilter&&geoFilter.indexOf(r.geo)===-1)return;
    byWeek[r.startOfWeek].hours+=convertHours(r.billableHours,r.shiftType);
    byWeek[r.startOfWeek].revenue+=r.totalRevenue;
  });
  return weeks.map(function(w){return{week:w,hours:byWeek[w].hours,revenue:byWeek[w].revenue};});
}

function aggregateMonthly(months,geoFilter){
  var byMonth={};
  months.forEach(function(m){byMonth[m]={hours:0,revenue:0};});
  monthlyRows.forEach(function(r){
    if(!byMonth[r.startOfMonth])return;
    if(geoFilter&&geoFilter.indexOf(r.geo)===-1)return;
    byMonth[r.startOfMonth].hours+=convertHours(r.billableHours,r.shiftType);
    byMonth[r.startOfMonth].revenue+=r.totalRevenue;
  });
  return months.map(function(m){return{month:m,hours:byMonth[m].hours,revenue:byMonth[m].revenue};});
}

function fm(v){return'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fn(v){return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fp(v){return(v>=0?'+':'')+((v)*100).toFixed(1)+'%';}
function fmtW(d){var p=d.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtM(d){var p=d.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,1).toLocaleDateString('en-US',{month:'short',year:'numeric'});}
function gc(v){return v>=0?'var(--green)':'var(--red)';}

function render(){
  if(currentTab==='hours')renderHours();
  else if(currentTab==='revenue')renderRevenue();
  else if(currentTab==='monthly')renderMonthly();
  else if(currentTab==='summary')renderSummary();
  else if(currentTab==='validation')renderValidation();
}

function renderHours(){
  var weeks=getFilteredWeeks();
  var geoFilter=getGeoFilter();
  var data=aggregateWeekly(weeks,geoFilter);
  if(!data.length){document.getElementById('ct').innerHTML='<div style="padding:40px;text-align:center;color:var(--text3)">No data for selected period</div>';return;}

  var latest=data[data.length-1];
  var prior=data.length>1?data[data.length-2]:null;
  var wow=prior&&prior.hours>0?(latest.hours-prior.hours)/prior.hours:0;
  var last4=data.slice(-4);
  var avg4=last4.reduce(function(s,d){return s+d.hours;},0)/last4.length;
  var ytdHours=data.reduce(function(s,d){return s+d.hours;},0);

  var html='<div class="kg">';
  html+='<div class="kpi"><div class="kl">Current Week</div><div class="kv g">'+fn(latest.hours)+'</div><div class="ks">'+fmtW(latest.week)+' &middot; hours</div></div>';
  html+='<div class="kpi"><div class="kl">Prior Week</div><div class="kv b">'+(prior?fn(prior.hours):'—')+'</div><div class="kt '+(wow>=0?'up':'dn')+'">'+fp(wow)+' WoW</div></div>';
  html+='<div class="kpi"><div class="kl">4-Week Average</div><div class="kv p">'+fn(avg4)+'</div><div class="ks">Rolling average</div></div>';
  html+='<div class="kpi"><div class="kl">Period Total</div><div class="kv">'+fn(ytdHours)+'</div><div class="ks">'+data.length+' weeks</div></div>';
  html+='</div>';

  html+=renderBarChart(data,'hours');
  html+=renderWeeklyTable(data,'hours');
  document.getElementById('ct').innerHTML=html;
}

function renderRevenue(){
  var weeks=getFilteredWeeks();
  var geoFilter=getGeoFilter();
  var data=aggregateWeekly(weeks,geoFilter);
  if(!data.length){document.getElementById('ct').innerHTML='<div style="padding:40px;text-align:center;color:var(--text3)">No data for selected period</div>';return;}

  var latest=data[data.length-1];
  var prior=data.length>1?data[data.length-2]:null;
  var wow=prior&&prior.revenue>0?(latest.revenue-prior.revenue)/prior.revenue:0;
  var last4=data.slice(-4);
  var avg4=last4.reduce(function(s,d){return s+d.revenue;},0)/last4.length;
  var total=data.reduce(function(s,d){return s+d.revenue;},0);

  var html='<div class="kg">';
  html+='<div class="kpi"><div class="kl">Current Week</div><div class="kv g">'+fm(latest.revenue)+'</div><div class="ks">'+fmtW(latest.week)+'</div></div>';
  html+='<div class="kpi"><div class="kl">Prior Week</div><div class="kv b">'+(prior?fm(prior.revenue):'—')+'</div><div class="kt '+(wow>=0?'up':'dn')+'">'+fp(wow)+' WoW</div></div>';
  html+='<div class="kpi"><div class="kl">4-Week Average</div><div class="kv p">'+fm(avg4)+'</div><div class="ks">Rolling average</div></div>';
  html+='<div class="kpi"><div class="kl">Period Total</div><div class="kv">'+fm(total)+'</div><div class="ks">'+data.length+' weeks</div></div>';
  html+='</div>';

  html+=renderBarChart(data,'revenue');
  html+=renderWeeklyTable(data,'revenue');
  document.getElementById('ct').innerHTML=html;
}

function renderBarChart(data,metric){
  var vals=data.map(function(d){return metric==='revenue'?d.revenue:d.hours;});
  var maxVal=Math.max.apply(null,vals);
  var minVal=Math.min.apply(null,vals);
  if(maxVal===0)return'';

  var bars='';
  var step=data.length>52?4:data.length>26?2:1;
  data.forEach(function(d,i){
    var v=metric==='revenue'?d.revenue:d.hours;
    var pct=maxVal>0?Math.round(v/maxVal*85+10):10;
    var isPeak=v===maxVal;
    var isLow=v===minVal;
    var col=isPeak?'var(--green)':isLow?'var(--amber)':'var(--blue)';
    var label=metric==='revenue'?fm(v):fn(v);
    var weekLabel=fmtW(d.week||d.month);
    bars+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:180px;gap:2px;min-width:6px" title="'+weekLabel+': '+label+'">';
    bars+='<div style="width:100%;height:'+pct+'%;background:'+col+';border-radius:2px 2px 0 0;min-height:3px"></div>';
    if(i%step===0&&step<=2)bars+='<div style="font-size:7px;color:var(--text3);text-align:center;white-space:nowrap;transform:rotate(-45deg);margin-top:2px">'+weekLabel+'</div>';
    else bars+='<div style="height:12px"></div>';
    bars+='</div>';
  });

  var title=metric==='revenue'?'Weekly Revenue':'Weekly Hours of Service';
  var html='<div class="fc"><div class="ct">'+title+'</div>';
  html+='<div style="display:flex;align-items:flex-end;gap:2px;padding:8px 0">'+bars+'</div>';
  html+='<div style="display:flex;gap:16px;margin-top:8px;font-size:11px;flex-wrap:wrap">';
  html+='<span><span style="display:inline-block;width:10px;height:10px;background:var(--green);border-radius:2px;margin-right:4px;vertical-align:middle"></span>Peak</span>';
  html+='<span><span style="display:inline-block;width:10px;height:10px;background:var(--amber);border-radius:2px;margin-right:4px;vertical-align:middle"></span>Lowest</span>';
  html+='<span><span style="display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:2px;margin-right:4px;vertical-align:middle"></span>Other weeks</span>';
  html+='</div></div>';
  return html;
}

function renderWeeklyTable(data,metric){
  var recent=data.slice().reverse().slice(0,20);
  var html='<div class="fc"><div class="ct">Weekly Detail &mdash; Last '+recent.length+' weeks</div>';
  html+='<div class="scroll-wrap"><table class="tbl"><thead><tr><th>Week</th><th>'+(metric==='revenue'?'Revenue':'Hours')+'</th><th>vs Prior</th><th>Growth</th></tr></thead><tbody>';
  recent.forEach(function(d,i){
    var v=metric==='revenue'?d.revenue:d.hours;
    var next=recent[i+1];
    var pv=next?(metric==='revenue'?next.revenue:next.hours):null;
    var diff=pv!==null?v-pv:null;
    var pct=pv&&pv>0?(v-pv)/pv:null;
    html+='<tr>';
    html+='<td>'+fmtW(d.week||d.month)+'</td>';
    html+='<td style="color:var(--blue)">'+(metric==='revenue'?fm(v):fn(v))+'</td>';
    html+='<td style="color:'+(diff!==null?gc(diff):'var(--text3)')+'">'+(diff!==null?(metric==='revenue'?(diff>=0?'+':'')+fm(diff):(diff>=0?'+':'')+fn(diff)):'—')+'</td>';
    html+='<td>'+(pct!==null?'<span class="bdg '+(pct>=0?'bg':'br')+'">'+fp(pct)+'</span>':'—')+'</td>';
    html+='</tr>';
  });
  html+='</tbody></table></div></div>';
  return html;
}

function renderMonthly(){
  var months=getFilteredMonths();
  var geoFilter=getGeoFilter();
  var data=aggregateMonthly(months,geoFilter);
  if(!data.length){document.getElementById('ct').innerHTML='<div style="padding:40px;text-align:center;color:var(--text3)">No data for selected period</div>';return;}

  var latest=data[data.length-1];
  var prior=data.length>1?data[data.length-2]:null;
  var mom=prior&&prior.hours>0?(latest.hours-prior.hours)/prior.hours:0;
  var totalHrs=data.reduce(function(s,d){return s+d.hours;},0);
  var totalRev=data.reduce(function(s,d){return s+d.revenue;},0);

  var html='<div class="kg">';
  html+='<div class="kpi"><div class="kl">Latest Month Hours</div><div class="kv g">'+fn(latest.hours)+'</div><div class="ks">'+fmtM(latest.month)+'</div></div>';
  html+='<div class="kpi"><div class="kl">Latest Month Revenue</div><div class="kv b">'+fm(latest.revenue)+'</div><div class="ks">'+fmtM(latest.month)+'</div></div>';
  html+='<div class="kpi"><div class="kl">MoM Hours Change</div><div class="kv '+(mom>=0?'g':'r')+'">'+fp(mom)+'</div><div class="ks">'+(prior?fmtM(prior.month)+' &rarr; '+fmtM(latest.month):'')+'</div></div>';
  html+='<div class="kpi"><div class="kl">Period Total Revenue</div><div class="kv p">'+fm(totalRev)+'</div><div class="ks">'+data.length+' months</div></div>';
  html+='</div>';

  // Monthly hours bar chart
  var vals=data.map(function(d){return d.hours;});
  var maxVal=Math.max.apply(null,vals);
  var minVal=Math.min.apply(null,vals);
  var bars='';
  data.forEach(function(d,i){
    var pct=maxVal>0?Math.round(d.hours/maxVal*85+10):10;
    var isPeak=d.hours===maxVal;var isLow=d.hours===minVal;
    var col=isPeak?'var(--green)':isLow?'var(--amber)':'var(--blue)';
    bars+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:160px;gap:3px;min-width:20px" title="'+fmtM(d.month)+': '+fn(d.hours)+' hrs / '+fm(d.revenue)+'">';
    bars+='<div style="width:100%;height:'+pct+'%;background:'+col+';border-radius:3px 3px 0 0;min-height:4px"></div>';
    bars+='<div style="font-size:8px;color:var(--text3);text-align:center;white-space:nowrap">'+fmtM(d.month)+'</div>';
    bars+='</div>';
  });
  html+='<div class="fc"><div class="ct">Monthly Hours of Service</div>';
  html+='<div style="display:flex;align-items:flex-end;gap:3px;padding:8px 0">'+bars+'</div></div>';

  // Monthly table
  html+='<div class="fc"><div class="ct">Monthly Detail</div>';
  html+='<div class="scroll-wrap"><table class="tbl"><thead><tr><th>Month</th><th>Hours</th><th>Revenue</th><th>vs Prior Month</th><th>Growth</th></tr></thead><tbody>';
  var rev=data.slice().reverse();
  rev.forEach(function(d,i){
    var next=rev[i+1];
    var diff=next?d.hours-next.hours:null;
    var pct=next&&next.hours>0?(d.hours-next.hours)/next.hours:null;
    html+='<tr><td>'+fmtM(d.month)+'</td><td>'+fn(d.hours)+'</td><td style="color:var(--blue)">'+fm(d.revenue)+'</td>';
    html+='<td style="color:'+(diff!==null?gc(diff):'var(--text3)')+'">'+(diff!==null?(diff>=0?'+':'')+fn(diff):'—')+'</td>';
    html+='<td>'+(pct!==null?'<span class="bdg '+(pct>=0?'bg':'br')+'">'+fp(pct)+'</span>':'—')+'</td></tr>';
  });
  html+='</tbody></table></div></div>';
  document.getElementById('ct').innerHTML=html;
}

function renderSummary(){
  var weeks=getFilteredWeeks();
  var showWeeks=weeks.slice(-13);

  // Build state-level data
  var states=['Massachusetts','Maryland','Illinois','Virginia','Northern New Jersey'];
  var stateData={};
  states.forEach(function(s){stateData[s]={};showWeeks.forEach(function(w){stateData[s][w]=0;});});
  var grandTotal={};
  showWeeks.forEach(function(w){grandTotal[w]=0;});

  weeklyRows.forEach(function(r){
    if(showWeeks.indexOf(r.startOfWeek)===-1)return;
    var hrs=convertHours(r.billableHours,r.shiftType);
    // Map to state
    for(var st in STATE_ROLLUPS){
      if(STATE_ROLLUPS[st].indexOf(r.geo)!==-1){
        stateData[st][r.startOfWeek]+=hrs;
        break;
      }
    }
    // Grand total excludes NJ converted hours
    if(currentMode==='converted'&&r.geo==='Northern New Jersey')return;
    grandTotal[r.startOfWeek]+=hrs;
  });

  var html='<div class="fc"><div class="ct">State Summary &mdash; Last 13 Weeks ('+(currentMode==='converted'?'Converted':'Raw')+' Hours)</div>';
  html+='<div class="scroll-wrap"><table class="tbl"><thead><tr><th>State</th>';
  showWeeks.forEach(function(w){html+='<th>'+fmtW(w)+'</th>';});
  html+='</tr></thead><tbody>';
  states.forEach(function(s){
    html+='<tr><td>'+s+'</td>';
    showWeeks.forEach(function(w){
      html+='<td>'+fn(stateData[s][w])+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody><tfoot><tr><td>Grand Total'+(currentMode==='converted'?' (excl. NJ)':'')+'</td>';
  showWeeks.forEach(function(w){html+='<td>'+fn(grandTotal[w])+'</td>';});
  html+='</tr></tfoot></table></div></div>';

  // State bar chart for most recent week
  var latestWeek=showWeeks[showWeeks.length-1];
  var stateVals=states.map(function(s){return{state:s,hours:stateData[s][latestWeek]};});
  var maxH=Math.max.apply(null,stateVals.map(function(s){return s.hours;}));

  html+='<div class="fc"><div class="ct">Hours by State &mdash; Week of '+fmtW(latestWeek)+'</div>';
  stateVals.forEach(function(s){
    var pct=maxH>0?Math.round(s.hours/maxH*100):0;
    var col=s.state==='Massachusetts'?'var(--blue)':s.state==='Maryland'?'var(--green)':s.state==='Illinois'?'var(--purple)':s.state==='Virginia'?'var(--amber)':'var(--text3)';
    html+='<div class="mbr"><div class="mbl">'+s.state+'</div>';
    html+='<div class="mbt"><div class="mbf" style="width:'+pct+'%;background:'+col+'"></div></div>';
    html+='<div class="mbv">'+fn(s.hours)+'</div></div>';
  });
  html+='</div>';

  document.getElementById('ct').innerHTML=html;
}

var validationData=null;
function renderValidation(){
  var ct=document.getElementById('ct');
  var sun=getSunday(new Date());

  var html='<div class="fc" style="margin-bottom:12px"><div class="ct">Calculation Validation</div>';
  html+='<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">';
  html+='<label style="font-size:11px;color:var(--text2)">Week start (Sunday):</label>';
  html+='<input type="date" id="valWeek" value="'+sun+'" style="font-size:11px;padding:5px 10px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text)">';
  html+='<button onclick="fetchValidation()" style="font-size:11px;padding:5px 14px;border-radius:20px;border:.5px solid var(--border2);background:var(--text);color:var(--bg);cursor:pointer;font-weight:600">Fetch &amp; Validate</button>';
  html+='<span id="valStatus" style="font-size:11px;color:var(--text3)"></span>';
  html+='</div>';
  html+='<div style="font-size:11px;color:var(--text3);margin-bottom:8px">Fetches raw visit data from Viv and shows every calculation step. First fetch takes 1-2 minutes.</div>';
  html+='</div>';
  html+='<div id="valOutput">';
  if(validationData)html+=renderValidationData(validationData);
  html+='</div>';
  ct.innerHTML=html;
}

async function fetchValidation(){
  var week=document.getElementById('valWeek').value;
  var status=document.getElementById('valStatus');
  var output=document.getElementById('valOutput');
  status.textContent='Fetching from Viv...';
  output.innerHTML='<div style="padding:40px;text-align:center;color:var(--text3)">Loading... this may take 1-2 minutes.</div>';
  try{
    var res=await _authFetch(API+'?endpoint=weekly_volume&startWeek='+week+'&endWeek='+week+'&debug=true');
    if(!res.ok)throw new Error('API '+res.status);
    var data=await res.json();
    validationData={data:data,week:week};
    status.textContent='Loaded '+new Date().toLocaleTimeString();
    output.innerHTML=renderValidationData(validationData);
  }catch(e){
    status.textContent='Error: '+e.message;
    output.innerHTML='<div class="fc" style="color:var(--red)">Failed: '+e.message+'</div>';
  }
}

function renderValidationData(vd){
  var data=vd.data,week=vd.week;
  if(!data.debug||!data.debug.length)return'<div class="fc">No data returned</div>';
  var wk=data.debug[0],rows=wk.rows,skipped=wk.skipped,totalRaw=wk.totalVisitsRaw;

  var agg={};
  var grandHrs=0,grandVivRev=0,grandManualRev=0,grandConverted=0;
  rows.forEach(function(r){
    var k=r.geo+'|'+r.shiftType;
    if(!agg[k])agg[k]={geo:r.geo,shiftType:r.shiftType,hours:0,vivRevenue:0,manualRevenue:0,visits:0};
    agg[k].hours+=r.billableHours;agg[k].vivRevenue+=r.vivRevenue;agg[k].manualRevenue+=r.manualRevenue;agg[k].visits++;
    grandHrs+=r.billableHours;grandVivRev+=r.vivRevenue;grandManualRev+=r.manualRevenue;
    grandConverted+=(r.shiftType==='Live-In'?r.billableHours*2/3:r.billableHours);
  });
  var aggArr=Object.values(agg).sort(function(a,b){return b.vivRevenue-a.vivRevenue;});

  var h='';
  // Summary
  h+='<div class="fc"><div class="ct">Week of '+week+' — Summary</div>';
  h+='<div class="kg">';
  h+='<div class="kpi"><div class="kl">Raw Visits</div><div class="kv">'+totalRaw.toLocaleString()+'</div><div class="ks">Billable: '+rows.length+'</div></div>';
  h+='<div class="kpi"><div class="kl">Raw Hours</div><div class="kv">'+fn(grandHrs)+'</div></div>';
  h+='<div class="kpi"><div class="kl">Converted Hours</div><div class="kv g">'+fn(grandConverted)+'</div><div class="ks">Live-In x 2/3</div></div>';
  h+='<div class="kpi"><div class="kl">Viv Revenue</div><div class="kv b">'+fm(grandVivRev)+'</div><div class="ks">grossMargin.totalRevenue</div></div>';
  h+='</div>';
  h+='<div class="kg">';
  h+='<div class="kpi"><div class="kl">Manual Revenue</div><div class="kv a">'+fm(grandManualRev)+'</div><div class="ks">units x billRate + flat</div></div>';
  h+='<div class="kpi"><div class="kl">Revenue Diff</div><div class="kv '+(Math.abs(grandVivRev-grandManualRev)<100?'g':'r')+'">'+fm(grandVivRev-grandManualRev)+'</div><div class="ks">Viv - Manual</div></div>';
  h+='<div class="kpi"><div class="kl">Skipped</div><div class="kv">'+Object.values(skipped).reduce(function(a,b){return a+b;},0)+'</div><div class="ks">Type:'+skipped.excludedType+' Cancel:'+skipped.canceled+' Geo:'+skipped.excludedGeo+' Client:'+skipped.excludedClient+' NoBill:'+skipped.nonBillable+'</div></div>';
  h+='</div></div>';

  // Agg table
  h+='<div class="fc"><div class="ct">Aggregation by GEO + Shift Type</div>';
  h+='<div class="scroll-wrap"><table class="tbl"><thead><tr><th>GEO</th><th>Shift</th><th>Visits</th><th>Hours</th><th>Converted</th><th>Viv Rev</th><th>Manual Rev</th><th>Diff</th></tr></thead><tbody>';
  aggArr.forEach(function(a){
    var conv=a.shiftType==='Live-In'?a.hours*2/3:a.hours;
    var diff=a.vivRevenue-a.manualRevenue;
    var warn=Math.abs(diff)>50;
    h+='<tr><td>'+a.geo+'</td><td>'+a.shiftType+'</td><td style="text-align:right">'+a.visits+'</td>';
    h+='<td style="text-align:right">'+fn(a.hours)+'</td><td style="text-align:right">'+fn(conv)+'</td>';
    h+='<td style="text-align:right">'+fm(a.vivRevenue)+'</td><td style="text-align:right">'+fm(a.manualRevenue)+'</td>';
    h+='<td style="text-align:right;'+(warn?'background:#fcebeb;color:#791f1f;font-weight:600':'')+'">'+fm(diff)+'</td></tr>';
  });
  h+='<tr style="border-top:2px solid var(--border2);font-weight:700"><td>TOTAL</td><td></td><td style="text-align:right">'+rows.length+'</td>';
  h+='<td style="text-align:right">'+fn(grandHrs)+'</td><td style="text-align:right">'+fn(grandConverted)+'</td>';
  h+='<td style="text-align:right">'+fm(grandVivRev)+'</td><td style="text-align:right">'+fm(grandManualRev)+'</td>';
  h+='<td style="text-align:right">'+fm(grandVivRev-grandManualRev)+'</td></tr>';
  h+='</tbody></table></div></div>';

  // Visit detail
  h+='<div class="fc"><div class="ct">Visit-Level Detail ('+rows.length+' visits)</div>';
  h+='<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">';
  h+='<select id="valGeo" onchange="filterValTable()" style="font-size:11px;padding:4px 8px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text)">';
  h+='<option value="all">All GEOs</option>';
  var geos=Array.from(new Set(rows.map(function(r){return r.geo;}))).sort();
  geos.forEach(function(g){h+='<option value="'+g+'">'+g+'</option>';});
  h+='</select>';
  h+='<select id="valShift" onchange="filterValTable()" style="font-size:11px;padding:4px 8px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text)">';
  h+='<option value="all">All Shifts</option><option value="Hourly">Hourly</option><option value="Live-In">Live-In</option></select></div>';
  h+='<div style="max-height:500px;overflow:auto;border:.5px solid var(--border);border-radius:var(--r)"><table class="tbl" id="valVisitTbl"><thead><tr>';
  h+='<th>Date</th><th>GEO</th><th>Client</th><th>Shift</th><th>Rate Type</th><th>Billing ms</th><th>Hours</th>';
  h+='<th>Client Rate</th><th>Bill Rate</th><th>Flat</th><th>Units</th><th>Manual Rev</th><th>Viv Rev</th><th>Diff</th><th>Filled</th>';
  h+='</tr></thead><tbody>';
  rows.sort(function(a,b){return a.date.localeCompare(b.date)||a.geo.localeCompare(b.geo);});
  rows.forEach(function(r){
    var diff=r.revenueDiff;var warn=Math.abs(diff)>1;
    h+='<tr data-geo="'+r.geo+'" data-shift="'+r.shiftType+'">';
    h+='<td>'+r.date+'</td><td>'+r.geo+'</td><td>'+r.client+'</td>';
    h+='<td style="text-align:right">'+r.shiftType+'</td><td style="text-align:right">'+r.rateType+'</td>';
    h+='<td style="text-align:right">'+r.billingMs.toLocaleString()+'</td><td style="text-align:right">'+fn(r.billableHours)+'</td>';
    h+='<td style="text-align:right">'+fm(r.clientRate)+'</td><td style="text-align:right">'+fm(r.billRate)+'</td>';
    h+='<td style="text-align:right">'+fm(r.billingFlat)+'</td><td style="text-align:right">'+fn(r.billingUnits)+'</td>';
    h+='<td style="text-align:right">'+fm(r.manualRevenue)+'</td>';
    h+='<td style="text-align:right;color:var(--blue)">'+fm(r.vivRevenue)+'</td>';
    h+='<td style="text-align:right;'+(warn?'background:#fcebeb;color:#791f1f;font-weight:600':'')+'">'+fm(diff)+'</td>';
    h+='<td style="text-align:right">'+(r.filled?'Yes':'Open')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  // Formula ref
  h+='<div class="fc"><div class="ct">Calculation Reference</div>';
  h+='<div style="font-size:12px;line-height:2">';
  h+='<b>billableHours</b> = billingMilliseconds / 3,600,000<br>';
  h+='<b>billingUnits</b> = if Daily: billableHours / 24, else: billableHours<br>';
  h+='<b>billingFlat</b> = sum of accs[].incClient<br>';
  h+='<b>Manual Revenue</b> = (billingUnits x billRate) + billingFlat<br>';
  h+='<b>Viv Revenue</b> = queries.grossMargin.totalRevenue (pre-computed)<br>';
  h+='<b>Converted Hours</b> = Live-In hours x 2/3; Hourly as-is<br>';
  h+='<b style="color:var(--blue)">Dashboard uses Viv Revenue</b>';
  h+='</div></div>';
  return h;
}

function filterValTable(){
  var geo=document.getElementById('valGeo').value;
  var shift=document.getElementById('valShift').value;
  document.querySelectorAll('#valVisitTbl tbody tr').forEach(function(r){
    var gm=geo==='all'||r.getAttribute('data-geo')===geo;
    var sm=shift==='all'||r.getAttribute('data-shift')===shift;
    r.style.display=(gm&&sm)?'':'none';
  });
}

init();

</script>
</body>
</html>
